{% extends "base.html" %}
{% block title %}Iniciar Sesión - Carnicería Pochito{% endblock %}
{% block content %}

<section class="flex justify-center items-center py-10">
  <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg">
    <h2 class="text-2xl font-bold text-center mb-6">Iniciar Sesión</h2>
    
    <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
      <!-- Nombre -->
      <div>
        <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre</label>
        <input type="text" id="nombre" name="nombre" required
               class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-600">
      </div>

      <!-- Apellido -->
      <div>
        <label for="apellido" class="block text-sm font-medium text-gray-700">Apellido</label>
        <input type="text" id="apellido" name="apellido" required
               class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-600">
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Correo electrónico</label>
        <input type="email" id="email" name="email" required
               class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-600">
      </div>

      <!-- Contraseña -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
        <input type="password" id="password" name="password" required
               class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-600">
      </div>

      <!-- Fecha de nacimiento -->
      <div>
        <label for="fecha_nacimiento" class="block text-sm font-medium text-gray-700">Fecha de nacimiento</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required
               class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-600">
      </div>

      <!-- DNI -->
      <div>
        <label for="dni" class="block text-sm font-medium text-gray-700">DNI</label>
        <input type="text" id="dni" name="dni" required maxlength="8"
               class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-600">
      </div>

      <!-- Dirección -->
      <div>
        <label for="direccion" class="block text-sm font-medium text-gray-700">Dirección</label>
        <input type="text" id="direccion" name="direccion" required
               class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-600">
      </div>

      <!-- Botón -->
      <button type="submit" 
              class="w-full bg-red-600 text-white py-2 px-4 rounded-lg hover:bg-red-800">
        Iniciar Sesión
      </button>
    </form>
  </div>
</section>

{% endblock %}
