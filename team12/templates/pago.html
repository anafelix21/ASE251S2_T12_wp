{% extends "base.html" %}
{% block title %}Pago - Carnicería Pochito{% endblock %}
{% block content %}

<h2 class="text-2xl font-bold mb-6 text-center">Finalizar Compra</h2>

<form class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">
  <label class="block mb-2">Método de pago</label>
  <select class="w-full p-2 border rounded mb-4">
    <option>Tarjeta de crédito</option>
    <option>Yape / Plin</option>
    <option>Contra entrega</option>
  </select>

  <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-800">
    Confirmar Pago
  </button>
</form>

{% endblock %}
